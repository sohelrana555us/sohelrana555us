<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9"><meta name="description" content="সাবিহা কসমেটিক্সের গ্রাহকের বাকি ও জমার হিসাব">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>দোকানের বাকি খাতা — সাবিহা কসমেটিক্স</title>
<style>
:root{--p:#6d28d9;--bg:#f7f5fb;--ink:#241b35;--muted:#716b7b;--line:#e9e3f0;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(120deg,#5b21b6,#8b5cf6);color:white;padding:22px 16px 26px;border-radius:0 0 22px 22px}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;opacity:.9;font-size:14px}.wrap{max-width:760px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-7px}.stat,.panel,.customer,.modal-card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 14px #34204a0a}.stat small{color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--p);color:white;font:inherit;font-weight:600;cursor:pointer}.btn.secondary{background:#eee8f8;color:#4c1d95}.btn.danger{background:#fee2e2;color:#991b1b}.btn.green{background:#dcfce7;color:#166534}.search,input,textarea,select{width:100%;padding:12px;border:1px solid #ddd5e8;border-radius:10px;font:inherit;background:white;color:var(--ink)}label{display:block;font-size:14px;margin:10px 0 5px;color:#51485e}.list{display:grid;gap:9px;margin-top:10px}.customer{display:flex;align-items:center;gap:12px;cursor:pointer}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#eee8f8;display:grid;place-items:center;font-size:22px;flex:none}.customer .meta{flex:1;min-width:0}.customer b{display:block}.customer small{color:var(--muted)}.amount{font-weight:700;color:var(--red);white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:26px}.modal{position:fixed;inset:0;background:#160d25a8;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.modal-card{width:min(100%,620px);max-height:92vh;overflow:auto;border-radius:18px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:19px;margin:0}.x{border:0;background:#f1edf5;border-radius:50%;width:36px;height:36px;font-size:20px}.row{display:flex;gap:8px}.row>*{flex:1}.tabs{display:flex;gap:7px;margin:14px 0}.tabs button{flex:1}.history{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:8px}.history small{display:block;color:var(--muted)}.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}.foot{color:var(--muted);font-size:12px;text-align:center;padding:22px 8px}
@media(min-width:600px){.modal{align-items:center}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<header><h1>সাবিহা কসমেটিক্স</h1><p>দোকানের বাকি খাতা · গ্রাহকের হিসাব সহজে রাখুন</p></header>
<main class="wrap">
<section class="stats"><div class="stat"><small>মোট গ্রাহক</small><strong id="count">০</strong></div><div class="stat"><small>মোট বাকি</small><strong id="due">৳০</strong></div><div class="stat"><small>মোট জমা</small><strong id="paid">৳০</strong></div></section>
<div class="actions"><button class="btn" onclick="openAdd()">＋ নতুন গ্রাহক</button><button class="btn secondary" onclick="exportData()">⬇ ব্যাকআপ</button><button class="btn secondary" onclick="document.getElementById('restore').click()">⬆ ব্যাকআপ ফেরত</button><input id="restore" type="file" accept="application/json" hidden onchange="importData(event)"></div>
<input id="search" class="search" placeholder="নাম বা মোবাইল নম্বর দিয়ে খুঁজুন" oninput="render()">
<h3>গ্রাহকের তালিকা</h3><div id="customers" class="list"></div>
<div class="foot">ডেটা এই ফোনের ব্রাউজারে সংরক্ষিত থাকে। নিয়মিত ব্যাকআপ রাখুন।</div>
</main>
<div class="modal" id="modal"><div class="modal-card" id="modalContent"></div></div>
<script>
const KEY='sabiha_baki_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"customers":[]}');let active=null;
const money=n=>'৳'+Number(n||0).toLocaleString('bn-BD',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};
const due=c=>c.tx.reduce((s,t)=>s+(t.type==='baki'?+t.amount:-t.amount),0);
function render(){let cs=db.customers;document.getElementById('count').textContent=cs.length.toLocaleString('bn-BD');document.getElementById('due').textContent=money(cs.reduce((s,c)=>s+Math.max(0,due(c)),0));document.getElementById('paid').textContent=money(cs.reduce((s,c)=>s+c.tx.filter(t=>t.type==='joma').reduce((a,t)=>a+ +t.amount,0),0));let q=document.getElementById('search').value.toLowerCase();let arr=cs.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q));document.getElementById('customers').innerHTML=arr.length?arr.map(c=>`<div class="customer" onclick="profile('${c.id}')"><div class="avatar">${c.photo?`<img class="avatar" src="${c.photo}">`:'👤'}</div><div class="meta"><b>${esc(c.name)}</b><small>${esc(c.phone||'মোবাইল নেই')}</small></div><div class="amount">${money(Math.max(0,due(c)))}</div></div>`).join(''):'<div class="panel empty">এখনো কোনো গ্রাহক যোগ করা হয়নি।<br>＋ নতুন গ্রাহক চাপুন।</div>'}
function show(content){document.getElementById('modalContent').innerHTML=content;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openAdd(){show(`<div class="modal-head"><h2>নতুন গ্রাহক</h2><button class="x" onclick="closeModal()">×</button></div><form onsubmit="addCustomer(event)"><label>গ্রাহকের নাম *</label><input id="n" required><label>মোবাইল নম্বর</label><input id="p" inputmode="tel"><label>ঠিকানা</label><textarea id="a" rows="2"></textarea><label>গ্রাহকের ছবি</label><input id="photo" type="file" accept="image/*"><button class="btn" style="width:100%;margin-top:14px">গ্রাহক সংরক্ষণ</button></form>`)}
function addCustomer(e){e.preventDefault();let f=document.getElementById('photo').files[0];let c={id:crypto.randomUUID(),name:document.getElementById('n').value.trim(),phone:document.getElementById('p').value.trim(),address:document.getElementById('a').value.trim(),photo:'',tx:[]};if(f){let r=new FileReader();r.onload=()=>{c.photo=r.result;db.customers.unshift(c);save();closeModal()};r.readAsDataURL(f)}else{db.customers.unshift(c);save();closeModal()}}
function profile(id){active=db.customers.find(c=>c.id===id);if(!active)return;let c=active;show(`<div class="modal-head"><h2>গ্রাহকের বিস্তারিত</h2><button class="x" onclick="closeModal()">×</button></div><div style="display:flex;align-items:center;gap:12px;margin:12px 0"><div class="avatar">${c.photo?`<img class="avatar" src="${c.photo}">`:'👤'}</div><div><b>${esc(c.name)}</b><div>${esc(c.phone||'মোবাইল নেই')}</div><small>${esc(c.address||'ঠিকানা দেওয়া হয়নি')}</small></div></div><div class="stat"><small>বর্তমান বাকি</small><strong>${money(Math.max(0,due(c)))}</strong></div><div class="tabs"><button class="btn" onclick="transaction('baki')">＋ বাকি যোগ</button><button class="btn green" onclick="transaction('joma')">＋ জমা নিন</button></div><h3>লেনদেনের ইতিহাস</h3><div>${c.tx.length?[...c.tx].reverse().map(t=>`<div class="history"><div><b>${t.type==='baki'?'বাকি':'জমা'}</b><small>${esc(t.note||'বিবরণ নেই')} · ${new Date(t.date).toLocaleString('bn-BD')}</small></div><span class="${t.type==='baki'?'neg':'pos'}">${t.type==='baki'?'+':'−'}${money(t.amount)}</span></div>`).join(''):'<div class="empty">কোনো লেনদেন নেই</div>'}</div><div class="actions"><button class="btn secondary" onclick="editCustomer()">তথ্য সম্পাদনা</button><button class="btn danger" onclick="deleteCustomer()">গ্রাহক মুছুন</button></div>`)}
function transaction(type){let title=type==='baki'?'বাকি যোগ করুন':'জমা গ্রহণ করুন';show(`<div class="modal-head"><h2>${title}</h2><button class="x" onclick="profile('${active.id}')">×</button></div><form onsubmit="saveTx(event,'${type}')"><label>টাকার পরিমাণ *</label><input id="amt" type="number" min="1" step="0.01" required><label>বিবরণ (ঐচ্ছিক)</label><input id="note" placeholder="যেমন: পণ্য কেনা / টাকা পরিশোধ"><button class="btn" style="width:100%;margin-top:14px">সংরক্ষণ</button></form>`)}
function saveTx(e,type){e.preventDefault();active.tx.push({id:crypto.randomUUID(),type,amount:+document.getElementById('amt').value,note:document.getElementById('note').value,date:new Date().toISOString()});save();profile(active.id)}
function editCustomer(){let c=active;show(`<div class="modal-head"><h2>তথ্য সম্পাদনা</h2><button class="x" onclick="profile('${c.id}')">×</button></div><form onsubmit="updateCustomer(event)"><label>নাম</label><input id="en" required value="${esc(c.name)}"><label>মোবাইল</label><input id="ep" value="${esc(c.phone)}"><label>ঠিকানা</label><textarea id="ea">${esc(c.address)}</textarea><label>নতুন ছবি (ঐচ্ছিক)</label><input id="epic" type="file" accept="image/*"><button class="btn" style="width:100%;margin-top:14px">আপডেট</button></form>`)}
function updateCustomer(e){e.preventDefault();active.name=document.getElementById('en').value.trim();active.phone=document.getElementById('ep').value.trim();active.address=document.getElementById('ea').value.trim();let f=document.getElementById('epic').files[0];if(f){let r=new FileReader();r.onload=()=>{active.photo=r.result;save();profile(active.id)};r.readAsDataURL(f)}else{save();profile(active.id)}}
function deleteCustomer(){if(confirm('এই গ্রাহক ও তার সব লেনদেন মুছে ফেলবেন?')){db.customers=db.customers.filter(c=>c.id!==active.id);active=null;save();closeModal()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sabiha-cosmetics-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.customers))throw Error();if(confirm('বর্তমান হিসাবের বদলে ব্যাকআপের তথ্য বসাবেন?')){db=d;save();alert('ব্যাকআপ সফলভাবে ফেরত এসেছে।')}}catch(_){alert('ফাইলটি সঠিক ব্যাকআপ নয়।')}e.target.value=''};r.readAsText(f)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
